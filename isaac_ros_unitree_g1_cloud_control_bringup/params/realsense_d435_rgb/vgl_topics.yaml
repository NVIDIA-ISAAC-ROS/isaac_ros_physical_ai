# RealSense D435 publishes IR on infra1/infra2 (already rectified, in
# image_rect_raw). VGL's default auto-remap targets left/right/image_raw,
# which the realsense driver does not produce. This file feeds VGL explicit
# topic names via its topic_config_file mechanism, avoiding the need for
# relay nodes or a fork of the realsense2_camera remap logic.
stereo_cameras:
  - left: /realsense_d435_rgb/infra1/image_rect_raw
    left_camera_info: /realsense_d435_rgb/infra1/camera_info
    right: /realsense_d435_rgb/infra2/image_rect_raw
    right_camera_info: /realsense_d435_rgb/infra2/camera_info
