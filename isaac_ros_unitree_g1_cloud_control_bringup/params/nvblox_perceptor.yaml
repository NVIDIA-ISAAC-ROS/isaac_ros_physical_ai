/**:
  ros__parameters:
    # printing statistics on console
    print_timings_to_console: false
    print_rates_to_console: false
    print_delays_to_console: false
    # Lidar settings
    use_lidar: false
    # QoS settings
    input_qos: "SENSOR_DATA"
    # Map clearing settings
    map_clearing_frame_id: "pelvis"
    # Rviz visualization
    esdf_slice_bounds_visualization_attachment_frame_id: "pelvis"
    # Reduce decay rate to save compute
    decay_tsdf_rate_hz: 1.0
    decay_dynamic_occupancy_rate_hz: 5.0
    # Depth integration rate limit
    integrate_depth_rate_hz: 35.0

    # Limit visualization overhead
    integrate_color_rate_hz: 1.0
    update_mesh_rate_hz: -1.0
    # Exclusion height relative to base_link (at camera position ~1m above ground)
    layer_visualization_exclusion_height_m: 0.5
    layer_visualization_exclusion_radius_m: 5.0
    layer_streamer_bandwidth_limit_mbps: 150.0

    multi_mapper:
      remove_small_connected_components: true

    static_mapper:
      # ESDF slice height relative to base_link frame
      # NOTE: base_link is at CAMERA position (~1m above ground) for map compatibility
      # Use NEGATIVE values to reach ground level
      esdf_slice_height: 0.0  
      esdf_slice_min_height: -0.8
      esdf_slice_max_height: 0.0
      # view calculator (only map inside the height bounds)
      workspace_bounds_type: "height_bounds" # ["unbounded", "height_bounds", "bounding_box"]
      workspace_bounds_min_height_m: -1.1   # Ground level + margin
      workspace_bounds_max_height_m: 1.0    # ~2m above ground (1m above camera)
      # tsdf decay - Turned up to deal with movement in the scene
      tsdf_decay_factor: 0.85
      # do not send ceiling (relative to base_link at camera position ~1m above ground):
      layer_streamer_exclusion_height_m: 0.5  # Exclude ceiling (~1.5m above ground)
      layer_streamer_exclusion_radius_m: 5.0
      # Disable neighborhood check to speed up the freespace kernel
      check_neighborhood: true

    dynamic_mapper:
      # Dynamic obstacles ESDF slice (relative to base_link at camera ~1m above ground)
      # Use NEGATIVE values to reach ground level
      esdf_slice_height: 0.0 
      esdf_slice_min_height: -0.8
      esdf_slice_max_height: 0.0
      # occupancy decay integrator
      free_region_decay_probability: 0.55
      occupied_region_decay_probability: 0.30
