# RealSense D435 configuration for G1 teleop bringup.
# Color-only at 640x480 @ 30fps — matches the recorder's sync_rate default
# and the MuJoCo camera_publish_rate set in g1_ros2_control.urdf.xacro.
# Depth/infrared/IMU disabled (only RGB needed for VLA training data).
# Uses default RELIABLE QoS for NITROS H264 encoder compatibility.
camera_name: realsense_d435_rgb

rgb_camera:
  color_profile: '640x480x30'
  profile: '640x480x30'  # backwards compatibility for older realsense2_camera

enable_color: true
enable_depth: false
enable_infra1: false
enable_infra2: false
enable_accel: false
enable_gyro: false

pointcloud:
  enable: false
