# Reset triggers for pose_reset_node (re-anchors world_teleop->pelvis from the
# XR end-effector references). Both triggers can run together.
pose_reset_node:
  ros__parameters:
    # --- Pinch trigger (gloves) ---
    # Bimanual pinch threshold: thumb-tip to little-finger-tip distance (m),
    # per hand, from the /xr_teleop/hand frames; <= 0 disables.
    pinch_threshold_m: 0.025

    # --- Button trigger (joysticks) ---
    # /xr_teleop/controller_data field names, all required together; [] disables.
    # Default = Y (left controller) + B (right controller).
    reset_button_combo: ["left_secondary_click", "right_secondary_click"]
    # Button value >= this counts as pressed.
    press_threshold: 0.5

    # --- Frame ---
    # G1 root link the world_teleop frame is anchored to.
    child_frame_id: pelvis
    # Child-frame translational offset [x, y, z] (m).
    child_frame_offset: [-0.25, 0.0, 0.0]
